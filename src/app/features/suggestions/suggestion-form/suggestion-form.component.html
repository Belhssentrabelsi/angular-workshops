<div class="form-container">
  <form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Titre :</label>
      <input type="text" formControlName="title" placeholder="Titre de la suggestion">
      <div class="error" *ngIf="suggestionForm.get('title')?.invalid && suggestionForm.get('title')?.touched">
        <span *ngIf="suggestionForm.get('title')?.errors?.['required']">Le titre est obligatoire.</span>
        <span *ngIf="suggestionForm.get('title')?.errors?.['minlength']">Minimum 5 caractères.</span>
        <span *ngIf="suggestionForm.get('title')?.errors?.['pattern']">Doit commencer par une majuscule et contenir uniquement des lettres.</span>
      </div>
    </div>

    <div class="form-group">
      <label>Description :</label>
      <textarea formControlName="description" placeholder="Description de la suggestion"></textarea>
      <div class="error" *ngIf="suggestionForm.get('description')?.invalid && suggestionForm.get('description')?.touched">
        <span *ngIf="suggestionForm.get('description')?.errors?.['required']">La description est obligatoire.</span>
        <span *ngIf="suggestionForm.get('description')?.errors?.['minlength']">Minimum 30 caractères.</span>
      </div>
    </div>

    <div class="form-group">
      <label>Catégorie :</label>
      <select formControlName="category">
        <option value="">-- Sélectionnez une catégorie --</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
      <div class="error" *ngIf="suggestionForm.get('category')?.invalid && suggestionForm.get('category')?.touched">
        <span>La catégorie est obligatoire.</span>
      </div>
    </div>

    <div class="form-group">
      <label>Date :</label>
      <input type="text" formControlName="date" readonly>
    </div>

    <div class="form-group">
      <label>Status :</label>
      <input type="text" formControlName="status" readonly>
    </div>

    <button type="submit" [disabled]="suggestionForm.invalid">Soumettre</button>

  </form>
</div>
